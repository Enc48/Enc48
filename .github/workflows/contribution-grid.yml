name: Contribution grid

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-grid.yml
      - scripts/contribution-grid.py

permissions:
  contents: write

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the contribution grid
        run: python3 scripts/contribution-grid.py dist Enc48

      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
